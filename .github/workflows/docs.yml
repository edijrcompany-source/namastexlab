# Portal de docs (Etapa 12) — publica no GitHub Pages A CADA MERGE na main.
# "Se não está publicado, não existe."
name: docs

# AUTO-PUBLISH desativado até T-01 (pnpm-lock.yaml inexistente). Reativar push na main no T-01.
on:
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: npm i -g pnpm && pnpm install --frozen-lockfile
      - name: Redoc dos contratos (referência GERADA — nunca à mão)
        run: make docs-api
      - name: VitePress
        run: pnpm dlx vitepress build docs
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
