openapi: 3.1.0
info:
  title: AutoSeguro Sales Agent — agent-api
  version: 1.0.0
  summary: API do Agente de vendas (conversa, cotação, handoff)
  description: |
    **Contrato API-first** — fonte única da verdade do agent-api (spec §5.4).

    - Turno síncrono (ADR-0007): `POST /messages` responde com a fala do Agente.
    - PII mascarada em TODA saída (NFR-12 — regex da spec §3).
    - Erros no formato RFC 7807 (`application/problem+json`).
    - IDs públicos são ULID (26 chars, Crockford Base32).
    - Fluxo de consumo: front gera types (openapi-typescript) → mock Prism →
      drift test no CI (openapi.json da app vs este YAML).
  contact: { name: "Namastex FDE Challenge — entrega", url: "https://github.com/edijrcompany-source/namastexlab" }
servers:
  - url: http://localhost:8001
    description: dev local (docker compose)
  - url: https://agent-api-demo.up.railway.app
    description: demo pública (Railway, região São Paulo)
tags:
  - name: conversas
    description: Ciclo de vida da conversa e turnos do Agente
  - name: handoffs
    description: Fila de escalonamento para Vendedor humano
  - name: sistema
    description: Health e metadados

paths:
  /conversations:
    post:
      tags: [conversas]
      operationId: criarConversa
      summary: Cria conversa vazia (aguarda primeira mensagem)
      description: |
        Abre uma conversa em QUALIFICANDO e devolve a saudação canônica
        (spec §6.1). Correlation ID opcional via header (Etapa 6 §2).
      responses:
        "201":
          description: Conversa criada em QUALIFICANDO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversaCriada" }
              examples:
                criada:
                  value:
                    conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA"
                    estado: "QUALIFICANDO"
                    criada_em: "2026-09-01T12:00:00Z"
        "429": { $ref: "#/components/responses/Problem" }

  /conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      tags: [conversas]
      operationId: obterConversa
      summary: Timeline completa (PII mascarada) — rastreabilidade total
      description: |
        Reconstitui a conversa: mensagens, eventos (seq ordenado), cotações,
        handoff. Toda saída passa pelo masking §3 (NFR-12).
      responses:
        "200":
          description: Timeline com mensagens, eventos, cotações e handoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [conversas]
      operationId: apagarConversa
      summary: Direito à eliminação (LGPD) — apaga conversa e eventos em cascata
      description: |
        Requer ADMIN_TOKEN (Etapa 10 §3). Apaga a conversa e todo o histórico
        associado (cascata da Etapa 8).
      security: [{ adminToken: [] }]
      responses:
        "204": { description: Apagada }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /conversations/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: Idempotency-Key
        in: header
        required: false
        description: "Retentativa com a mesma chave (janela 2 min) devolve o turno original (replay)"
        schema: { type: string, maxLength: 64 }
      - name: X-Correlation-Id
        in: header
        required: false
        description: "UUID v4 do client; ecoado no problem+json e nos logs"
        schema: { type: string, format: uuid }
    post:
      tags: [conversas]
      operationId: enviarMensagem
      summary: Um turno do Lead → resposta síncrona do Agente
      description: |
        Pior caso ~8s (LLM + 3 tentativas no legado) — client front usa timeout
        de 15s. Estados intermediários chegam como `eventos` do turno.
        Em `HANDOFF`/terminal o Agente responde idempotente (spec §1.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensagemIn" }
            examples:
              texto:
                value: { text: "oi, quero cotar um seguro" }
              midia:
                value: { media_type: "document", media_marker: "[documento] CNH_frente.pdf" }
      responses:
        "200":
          description: Turno processado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnoResponse" }
              examples:
                qualificando:
                  summary: Agente pede dados
                  value:
                    conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA"
                    estado: "QUALIFICANDO"
                    reply: { role: "agente", tipo: "text", texto: "Oi! Pra cotar preciso: veículo com ano, sua idade e o CEP onde o carro dorme.", criado_em: "2026-09-01T12:00:05Z" }
                    eventos:
                      - { seq: 2, type: "message_in", payload: { texto: "oi, quero cotar um seguro" }, criado_em: "2026-09-01T12:00:03Z" }
                      - { seq: 3, type: "message_out", payload: { estado: "QUALIFICANDO" }, criado_em: "2026-09-01T12:00:05Z" }
                    cotacao: null
                    handoff: null
                cotacaoOk:
                  summary: Cotação apresentada (C1)
                  value:
                    conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA"
                    estado: "COTACAO_APRESENTADA"
                    reply: { role: "agente", tipo: "text", texto: "Plano Essencial: R$ 155,87/mês, franquia R$ 4.500,00, cobre colisão, roubo e furto. Roubo e furto passam a valer após 30 dias de carência. Te interessa?", criado_em: "2026-09-01T12:02:12Z" }
                    eventos:
                      - { seq: 9, type: "quote_succeeded", payload: { quote_id: "01J8ZA...", tentativas: 1, duracao_ms: 412 }, criado_em: "2026-09-01T12:02:11Z" }
                      - { seq: 10, type: "quote_presented", payload: { premio_mensal: 155.87 }, criado_em: "2026-09-01T12:02:12Z" }
                    cotacao:
                      quote_id: "01J8ZAW3D5F7G9J2K4M6N8PQAC"
                      plano_id: "essencial"
                      plano_nome: "Essencial"
                      premio_mensal: 155.87
                      franquia: 4500
                      coberturas: ["colisao", "roubo", "furto"]
                      multiplicadores: { faixa_etaria: 1.0, idade_veiculo: 1.0, regiao: 1.3 }
                      carencia: { coberturas: ["roubo", "furto"], dias: 30 }
                      pro_rata: null
                      moeda: "BRL"
                      tentativas: 1
                      duracao_ms: 412
                    handoff: null
                handoff:
                  summary: Handoff por aceite (C1 final)
                  value:
                    conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA"
                    estado: "HANDOFF"
                    reply: { role: "agente", tipo: "text", texto: "Fechado! Vou passar pra um vendedor finalizar a emissão. Já já te chamam.", criado_em: "2026-09-01T12:04:02Z" }
                    eventos:
                      - { seq: 14, type: "handoff_requested", payload: { motivo: "aceite_fechamento" }, criado_em: "2026-09-01T12:04:01Z" }
                    cotacao: null
                    handoff:
                      id: "01J8ZBQ4T7X9M2K6P8R0V3WYAC"
                      conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA"
                      motivo: "aceite_fechamento"
                      resumo: "Onix 2022, 30 anos, CEP 01***-***. Cotação essencial R$ 155,87 aceita."
                      criado_em: "2026-09-01T12:04:01Z"
                      status: "pendente"
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /conversations/{id}/export:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
      - name: fmt
        in: query
        schema: { type: string, enum: [json, md], default: json }
    get:
      tags: [conversas]
      operationId: exportarConversa
      summary: Log de execução exportável (entregável do desafio) — PII mascarada
      description: |
        fmt=json devolve a timeline; fmt=md devolve markdown legível com o
        correlation id (Etapa 6 §6). É o artefato "log de execução" da entrega.
      responses:
        "200":
          description: Artefato de export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
            text/markdown:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /handoffs:
    get:
      tags: [handoffs]
      operationId: listarHandoffs
      summary: Fila de handoffs pendentes (ordenada por criação)
      description: |
        Conversas transferidas a vendedor humano, com motivo (enum §5.3) e
        resumo mascarado. Consumida pela página /handoffs do front.
      responses:
        "200":
          description: Fila
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HandoffView" }
              examples:
                fila:
                  value:
                    items:
                      - { id: "01J8ZBQ4T7X9M2K6P8R0V3WYAC", conversation_id: "01J8Z9C3K5M7P9R2T4V6W8YBAA", motivo: "aceite_fechamento", resumo: "Onix 2022, 30 anos, CEP 01***-***. Cotação essencial R$ 155,87 aceita.", criado_em: "2026-09-01T12:04:01Z", status: "pendente" }

  /health:
    get:
      tags: [sistema]
      operationId: health
      summary: Saúde do agente e do legado (ping cacheado 30s)
      description: |
        Sempre 200 com estado detalhado; legado degradado não derruba o agente
        (degradação graceful — etapa-6 §5).
      responses:
        "200":
          description: Sempre 200 com estado detalhado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                ok: { value: { agent: "ok", legado: "ok", versao: "1.0.0" } }
                degradado: { value: { agent: "ok", legado: "degradado", versao: "1.0.0" } }

components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Ulid" }

  responses:
    Problem:
      description: Erro RFC 7807
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            naoEncontrado:
              value: { type: "https://autoseguro.dev/problems/conversa-inexistente", title: "Conversa não encontrada", status: 404, detail: "ULID informado não corresponde a nenhuma conversa." }

  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "ADMIN_TOKEN (definitivo na Etapa 10 — threat model)"

  schemas:
    Ulid:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: ["01J8Z9C3K5M7P9R2T4V6W8YBAA"]

    EstadoConversa:
      type: string
      enum: [QUALIFICANDO, CONFIRMANDO, COTANDO, COTACAO_APRESENTADA, OBJECAO, HANDOFF,
             ENCERRADA_GANHO_EM_ANDAMENTO, ENCERRADA_PERDIDO_INELIGIVEL, ENCERRADA_PERDIDO, ENCERRADA_SEM_RESPOSTA]

    MotivoHandoff:
      type: string
      description: Enum de código — nunca texto livre (spec §5.3)
      enum: [aceite_fechamento, inelegivel_contestado, objecao_preco, preferencia_humana, falha_tecnica, fora_escopo]

    TipoEvento:
      type: string
      enum: [conversation_started, message_in, message_out, intent_detected, lead_qualified,
             pre_check_failed, quote_requested, quote_attempt_failed, circuit_state_changed,
             quote_succeeded, quote_presented, quote_refused, objection_raised, handoff_requested,
             retry_scheduled, price_guard_violation, llm_unavailable, conversation_ended]

    ConversaCriada:
      type: object
      required: [conversation_id, estado, criada_em]
      properties:
        conversation_id: { $ref: "#/components/schemas/Ulid" }
        estado: { $ref: "#/components/schemas/EstadoConversa" }
        criada_em: { type: string, format: date-time }

    MensagemIn:
      type: object
      description: Texto OU mídia (marcador) — XOR
      oneOf:
        - type: object
          required: [text]
          properties:
            text: { type: string, maxLength: 4000, description: "Fala do Lead (PT-BR livre)" }
        - type: object
          required: [media_type, media_marker]
          properties:
            media_type: { type: string, enum: [image, audio, document] }
            media_marker: { type: string, maxLength: 200, examples: ["[documento] CNH_frente.pdf"] }

    MessageOut:
      type: object
      required: [role, tipo, texto, criado_em]
      properties:
        role: { type: string, enum: [lead, agente, vendedor] }
        tipo: { type: string, enum: [text, image, audio, document] }
        texto: { type: string, description: "PII mascarada (spec §3)" }
        criado_em: { type: string, format: date-time }

    EventoOut:
      type: object
      required: [seq, type, payload, criado_em]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/TipoEvento" }
        payload: { type: object, additionalProperties: true, description: "Payload mascarado" }
        criado_em: { type: string, format: date-time }

    ProRata:
      type: object
      required: [dias_no_mes, dias_cobrados, valor_primeiro_pagamento]
      properties:
        dias_no_mes: { type: integer }
        dias_cobrados: { type: integer }
        valor_primeiro_pagamento: { type: number, multipleOf: 0.01 }

    QuoteView:
      type: object
      required: [quote_id, plano_id, plano_nome, premio_mensal, franquia, coberturas, multiplicadores, carencia, moeda, tentativas, duracao_ms]
      properties:
        quote_id: { $ref: "#/components/schemas/Ulid" }
        plano_id: { type: string, enum: [essencial, completo, premium] }
        plano_nome: { type: string }
        premio_mensal: { type: number, multipleOf: 0.01, description: "Byte a byte igual ao apresentado ao Lead (NFR-09)" }
        franquia: { type: number }
        coberturas: { type: array, items: { type: string } }
        multiplicadores:
          type: object
          required: [faixa_etaria, idade_veiculo, regiao]
          properties:
            faixa_etaria: { type: number }
            idade_veiculo: { type: number }
            regiao: { type: number }
        carencia:
          type: object
          required: [coberturas, dias]
          properties:
            coberturas: { type: array, items: { type: string } }
            dias: { type: integer }
        pro_rata: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/ProRata" }] }
        moeda: { type: string, const: BRL }
        tentativas: { type: integer, minimum: 1, maximum: 3 }
        duracao_ms: { type: integer, description: "Duração total da cotação (todas as tentativas)" }

    HandoffView:
      type: object
      required: [id, conversation_id, motivo, resumo, criado_em, status]
      properties:
        id: { $ref: "#/components/schemas/Ulid" }
        conversation_id: { $ref: "#/components/schemas/Ulid" }
        motivo: { $ref: "#/components/schemas/MotivoHandoff" }
        resumo: { type: string, maxLength: 500, description: "Contexto p/ Vendedor (PII mascarada)" }
        criado_em: { type: string, format: date-time }
        status: { type: string, enum: [pendente, em_atendimento, concluido] }

    TurnoResponse:
      type: object
      required: [conversation_id, estado, reply, eventos]
      properties:
        conversation_id: { $ref: "#/components/schemas/Ulid" }
        estado: { $ref: "#/components/schemas/EstadoConversa" }
        reply: { $ref: "#/components/schemas/MessageOut" }
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoOut" }
        cotacao: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/QuoteView" }] }
        handoff: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/HandoffView" }] }

    Timeline:
      type: object
      required: [conversation_id, estado, mensagens, eventos, cotacoes, criada_em, atualizada_em]
      properties:
        conversation_id: { $ref: "#/components/schemas/Ulid" }
        estado: { $ref: "#/components/schemas/EstadoConversa" }
        dados_qualificados:
          oneOf:
            - type: "null"
            - type: object
              properties:
                veiculo_texto: { type: string }
                veiculo_ano: { type: integer }
                idade: { type: integer }
                cep: { type: string, examples: ["01***-***"], description: "Sempre mascarado na saída" }
        mensagens: { type: array, items: { $ref: "#/components/schemas/MessageOut" } }
        eventos: { type: array, items: { $ref: "#/components/schemas/EventoOut" } }
        cotacoes: { type: array, items: { $ref: "#/components/schemas/QuoteView" } }
        handoff: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/HandoffView" }] }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }

    Health:
      type: object
      required: [agent, legado, versao]
      properties:
        agent: { type: string, enum: [ok] }
        legado: { type: string, enum: [ok, degradado] }
        versao: { type: string }

    Problem:
      type: object
      description: RFC 7807 + extensão correlation_id (Etapa 6)
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: "Código estável = slug final da URI" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlation_id: { type: string, format: uuid, description: "Eco do X-Correlation-Id do client ou gerado pelo server — exibido na UI como código de suporte" }
      examples:
        - { type: "https://autoseguro.dev/problems/payload-invalido", title: "Payload inválido", status: 422, detail: "text e media_marker são mutuamente exclusivos." }
