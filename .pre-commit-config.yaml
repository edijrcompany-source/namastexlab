# Gates locais — mesmos checks do CI (Etapa 13 §3). Hooks ativam no git init do repo (T-01).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks   # segredos — blocker (Etapa 10 T11); varre também ai-logs/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/agent-api/
      - id: ruff-format
        files: ^services/agent-api/

  # JS/TS via workspace pnpm (deps no package.json raiz — devcontainer instala)
  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        entry: pnpm exec eslint apps/web --max-warnings 0
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx)$
      - id: prettier
        name: prettier (apps/web)
        entry: pnpm exec prettier apps/web --check
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|css)$
      - id: commitlint
        name: commitlint (gitmoji + type em inglês — Etapa 13 §2)
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: false
